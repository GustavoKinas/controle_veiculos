{% extends "admin/base_site.html" %}
{% block content %}
  <p>Usuário: {{ original.username }}</p>
  <form method="post">
    {% csrf_token %}
    {% if form %}
      {{ form.as_p }}
    {% else %}
      <p>Confirme esta alteração de identidade.</p>
      <input type="hidden" name="confirmar" value="on">
    {% endif %}
    <input type="submit" value="Confirmar">
  </form>
{% endblock %}
