server {
    listen 80;

    server_name _;

    client_max_body_size 20M;

    # Não anunciar a versão do nginx nas respostas e páginas de erro.
    server_tokens off;

    # Os estáticos são servidos pelo nginx a partir do volume que o
    # `collectstatic` do web preenche na subida — o gunicorn nunca é
    # incomodado com arquivo estático.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O botão "Sincronizar reservas" da agenda faz uma requisição HTTP à
        # Microsoft por caixa de recurso, tudo dentro do ciclo do request. Com
        # o padrão de 60s, uma API lenta apareceria para o operador como 504
        # do nginx. Casado com o `--timeout 120` do gunicorn.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
